<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Fleet Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23050505'/%3E%3Cpath d='m7 9 7 7-7 7m11 0h7' fill='none' stroke='%23ffd700' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/herdr.css">
<style>
  :root {
    --gold: #ffd700;
    --gold-dim: #b89b23;
    --bg: #050505;
    --card: #0d0d0d;
    --card-border: #262626;
    --text: #e8e4d8;
    --muted: #8a8578;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Cascadia Code", "JetBrains Mono", ui-monospace, Consolas, monospace;
    padding: 24px;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--card-border); padding-bottom: 14px; margin-bottom: 20px;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
  .sub { color: var(--muted); font-size: 12px; }
  .sub b { color: var(--gold-dim); font-weight: 500; }
  .refresh { margin-left: auto; color: var(--muted); font-size: 12px; }
  .refresh .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .usage-toggle {
    width: 100%; display: flex; align-items: center; gap: 8px;
    background: none; border: none; cursor: pointer; padding: 10px 2px;
    color: var(--gold); font-family: inherit; font-size: 14px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; text-align: left;
    border-bottom: 1px solid var(--card-border); margin-bottom: 14px;
  }
  .usage-toggle .chev { display: inline-block; transition: transform .15s; color: var(--gold-dim); }
  .usage-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .usage-toggle .hint { color: var(--muted); font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: auto; }
  .usage-body.collapsed { display: none; }

  .pulse-panel {
    position: relative; overflow: hidden; min-height: 184px; margin-bottom: 18px;
    background: #000603; border: 1px solid #123c24; border-radius: 4px;
    box-shadow: inset 0 0 24px rgba(0, 255, 102, .06), 0 0 12px rgba(0, 255, 102, .04);
  }
  .pulse-readout {
    position: absolute; z-index: 2; top: 12px; left: 14px;
    display: flex; align-items: baseline; gap: 9px; pointer-events: none;
    text-shadow: 0 0 8px rgba(50, 255, 126, .7);
  }
  .pulse-count { color: #32ff7e; font-size: 34px; font-weight: 700; line-height: 1; }
  .pulse-label { color: #7ee8a6; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .pulse-screen { position: relative; height: 182px; }
  .pulse-screen::after {
    content: ""; position: absolute; z-index: 1; top: 8px; bottom: 8px; left: 75%; width: 1px;
    background: linear-gradient(180deg, transparent, rgba(50, 255, 126, .2) 22%, rgba(50, 255, 126, .06) 78%, transparent);
    box-shadow: 0 0 9px rgba(50, 255, 126, .16); pointer-events: none;
  }
  .pulse-canvas {
    display: block; width: 100%; height: 182px;
    filter: drop-shadow(0 0 4px rgba(50, 255, 126, .72));
  }
  .pulse-cursor {
    position: absolute; z-index: 3; left: 75%; bottom: 9px; width: 10px; height: 10px;
    border: 1px solid rgba(210, 255, 225, .9); border-radius: 50%; background: #32ff7e;
    box-shadow: 0 0 5px #32ff7e, 0 0 13px rgba(50, 255, 126, .9), 0 0 25px rgba(50, 255, 126, .45);
    transform: translate(-50%, 50%); transition: bottom 42ms linear; pointer-events: none;
    animation: pulse-cursor-breathe 1.8s ease-in-out infinite;
  }
  .pulse-cursor.beat { animation: pulse-cursor-beat .52s ease-out; }
  @keyframes pulse-cursor-breathe {
    0%, 100% { box-shadow: 0 0 4px #32ff7e, 0 0 10px rgba(50, 255, 126, .65), 0 0 20px rgba(50, 255, 126, .28); }
    50% { box-shadow: 0 0 7px #32ff7e, 0 0 17px rgba(50, 255, 126, .95), 0 0 29px rgba(50, 255, 126, .48); }
  }
  @keyframes pulse-cursor-beat {
    0% { box-shadow: 0 0 5px #32ff7e, 0 0 12px rgba(50, 255, 126, .8); }
    35% { box-shadow: 0 0 9px #b9ffd1, 0 0 23px #32ff7e, 0 0 42px rgba(50, 255, 126, .9); }
    100% { box-shadow: 0 0 5px #32ff7e, 0 0 13px rgba(50, 255, 126, .75); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse-canvas { filter: drop-shadow(0 0 2px rgba(50, 255, 126, .45)); }
    .pulse-cursor, .pulse-cursor.beat { animation: none; transition: none; }
    .refresh .dot, .live { animation: none; }
  }
  /* Account-level charts share a quiet scale and readable text at every size. */
  .usage-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 980px) {
    .usage-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
  }
  .usage-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .ucard { background: var(--card); border: 1px solid var(--card-border); border-radius: 4px; padding: 12px 14px; min-width: 0; }
  .ucard-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .ucard-label { color: var(--gold); font-weight: 600; font-size: 13px; }
  .ucard-toggle { min-height: 44px; background: none; border: 0; padding: 4px 0; color: inherit; font: inherit; width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; cursor: pointer; }
  .ucard-toggle:hover .ucard-label { color: var(--text); }
  .ucard-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 2px; }
  .ucard .chev { width: 12px; height: 12px; flex: 0 0 auto; color: #aaa398; }
  .usage-stale { color: #aaa398; font-size: 11px; margin-left: auto; text-align: right; }
  .ucard-error { display: block; color: #c5b9a8; font-size: 12px; overflow-wrap: anywhere; }
  .ucard-notice { margin-bottom: 12px; }
  .gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 144px), 1fr)); gap: 20px 12px; }
  .gauge { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; text-align: center; font-variant-numeric: tabular-nums; }
  .gauge .glabel { color: var(--text); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
  .gauge-dial { position: relative; width: 144px; height: 88px; }
  .gauge svg { display: block; width: 144px; height: 88px; }
  .gvalue { position: absolute; inset: 34px 0 auto; color: var(--text); font-size: 26px; font-weight: 600; line-height: 1.15; }
  .gvalue small { display: block; color: #aaa398; font-size: 11px; font-weight: 400; margin-top: 2px; }
  .gvalue.unavailable { font-size: 15px; top: 43px; }
  .greset, .gproj { color: #aaa398; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
  .gproj.over { color: #f08b8b; }
  .forecast-key { display: inline-block; width: 6px; height: 6px; border: 1px solid currentColor; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .balance { display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
  .balance .amount { color: var(--gold); font-size: 26px; font-weight: 600; }
  .ucard.collapsed .ucard-head { margin-bottom: 8px; }
  .ucard.collapsed .chev { transform: rotate(-90deg); }
  .ucard-compact { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .ucard-compact .mini { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 5px; font-size: 12px; color: var(--text); }

  .session-table-wrap { border: 1px solid var(--card-border); border-radius: 4px; background: var(--card); }
  .session-table {
    width: 100%; border-collapse: collapse; font-size: 11px;
    table-layout: fixed;
  }
  .session-table th {
    position: sticky; top: 0; background: var(--card);
    color: var(--muted); font: 600 10px ui-monospace, monospace; text-transform: uppercase;
    letter-spacing: .05em; text-align: left; padding: 6px 10px;
    border-bottom: 1px solid var(--card-border);
    white-space: nowrap;
  }
  .session-table td {
    padding: 6px 10px; border-bottom: 1px solid var(--card-border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* computer / title / provider / model / effort / msgs / started / price / duration */
  .session-table th:nth-child(1), .session-table td:nth-child(1) { width: 14%; }
  .session-table th:nth-child(2), .session-table td:nth-child(2) { width: 20%; }
  .session-table th:nth-child(3), .session-table td:nth-child(3) { width: 16%; }
  .session-table th:nth-child(4), .session-table td:nth-child(4) { width: 12%; }
  .session-table th:nth-child(5), .session-table td:nth-child(5) { width: 6%; }
  .session-table th:nth-child(6), .session-table td:nth-child(6) { width: 6%; }
  .session-table th:nth-child(7), .session-table td:nth-child(7) { width: 8%; }
  .session-table th:nth-child(8), .session-table td:nth-child(8) { width: 8%; }
  .session-table th:nth-child(9), .session-table td:nth-child(9) { width: 10%; }
  .session-table tr.machine-head td {
    background: #080808; color: var(--gold);
    font-size: 11px; letter-spacing: 1px;
  }
  .session-table tr.machine-head .state { font-size: 10px; padding: 1px 6px; border: 1px solid; border-radius: 3px; }
  .session-table tr.machine-head .state.online { color: var(--gold); border-color: var(--gold-dim); }
  .session-table tr.machine-head .state.offline { color: var(--muted); border-color: var(--card-border); }
  .session-table tr.empty-row td { color: var(--muted); font-style: italic; border-bottom: 0; }
  .session-table tr.active td { background: rgba(255, 215, 0, .07); }
  .session-table tr.offline td { opacity: .45; }
  .session-table tr.flash td { animation: row-flash 1.2s ease-out; }
  @keyframes row-flash {
    from { background-color: rgba(255, 215, 0, .22); }
    to { background-color: transparent; }
  }
  .session-table tr:last-child td { border-bottom: 0; }
  .session-table tr.has-sub td { border-bottom: 0; }
  .session-table tr.subrow td {
    background: #0b0b0a; border-bottom: 1px solid var(--card-border);
    padding: 3px 10px 5px 26px;
  }
  .session-table tr.subrow td > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
  .session-table .out-text {
    color: var(--text); opacity: .8; font-size: 11px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; min-width: 0;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden;
  }
  .session-table .out-age { color: var(--muted); font-size: 10.5px; padding-top: 1px; }
  .session-table tr.toggleable { cursor: pointer; }
  .session-table .out-chev { color: var(--muted); display: inline-block; width: 12px; }
  .session-table tr.toggleable:hover .out-chev { color: var(--gold); }
  .pager { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; color: var(--muted); font-size: 11px; }
  .pager-btn { background: var(--card); border: 1px solid var(--card-border); color: var(--gold-dim); border-radius: 3px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
  .pager-btn:hover:not(:disabled) { color: var(--gold); border-color: var(--gold-dim); }
  .pager-btn:disabled { opacity: .35; cursor: default; }
  .pager-count { margin-left: auto; }
  .session-table .title { color: var(--gold); font-weight: 600; max-width: 300px; }
  .session-table .session-meta { display: block; margin-top: 4px; color: var(--text); font-size: 11px; font-weight: 400; white-space: normal; overflow-wrap: anywhere; }
  .session-app { color: var(--gold); font-weight: 600; }
  .session-table tr.offline td.title { opacity: 1; }
  .session-table .t3-title { white-space: normal; overflow-wrap: anywhere; }
  .session-state { color: var(--muted); }
  .session-state.working, .session-state.monitoring { color: #7ce3a3; }
  .session-state.waiting, .session-state.connecting { color: var(--gold); }
  .session-state.error, .session-state.unavailable { color: #ffab91; }
  .session-table .t3-details td { padding-top: 0; white-space: normal; }
  .t3-metrics { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--text); font-size: 10px; line-height: 1.6; }
  .t3-metrics span { white-space: nowrap; }
  .t3-metrics b { font-weight: 400; color: var(--muted); }
  .session-toggle { border: 0; padding: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .session-toggle:focus-visible, .source-status summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .source-status { margin-bottom: 10px; color: var(--muted); font-size: 11px; line-height: 1.6; }
  .source-status summary { cursor: pointer; width: fit-content; }
  .source-status .source-failure { color: #ffab91; }
  .source-notices { list-style: none; margin-top: 6px; overflow-wrap: anywhere; }
  @media (max-width: 680px) {
    .session-table th:nth-child(3), .session-table td:nth-child(3),
    .session-table th:nth-child(5), .session-table td:nth-child(5),
    .session-table th:nth-child(6), .session-table td:nth-child(6),
    .session-table th:nth-child(7), .session-table td:nth-child(7),
    .session-table th:nth-child(8), .session-table td:nth-child(8),
    .session-table th:nth-child(9), .session-table td:nth-child(9) { display: none; }
    .session-table th:nth-child(1), .session-table td:nth-child(1) { width: 20%; }
    .session-table th:nth-child(2), .session-table td:nth-child(2) { width: 50%; }
    .session-table th:nth-child(4), .session-table td:nth-child(4) { width: 30%; }
    .session-table td { padding: 6px; }
    .session-table .t3-details td { width: auto; }
    .t3-metrics { gap: 3px 12px; }
  }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1.5s infinite; flex: none; }
  .idle-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; flex: none; }
  .empty-line { color: var(--muted); font-size: 12px; font-style: italic; padding: 4px 0 8px; }
  footer { margin-top: 12px; color: var(--muted); font-size: 11px; }
  footer a { color: var(--gold-dim); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>Agent Fleet Dashboard</h1>
  <span class="sub" id="generated"></span>
  <span class="refresh"><span class="dot"></span>live · refresh 5s</span>
</header>
<section class="herdr-section" aria-labelledby="herdr-title">
  <h2 id="herdr-title"><button id="herdr-toggle" class="usage-toggle" type="button" aria-expanded="false" aria-controls="herdr-body"><span class="chev" aria-hidden="true">▾</span> Live Herdr agents</button></h2>
  <div id="herdr-body" hidden>
  <nav id="herdr-machines" class="herdr-machines" aria-label="Machine terminals"></nav>
  <div class="herdr-controls">
    <label>Machine <select id="herdr-machine-filter"><option value="all">All machines</option></select></label>
    <label>State <select id="herdr-state-filter"><option value="all">All states</option><option value="blocked">Blocked</option><option value="done">Done</option><option value="working">Working</option><option value="idle">Idle</option><option value="unknown">Unknown</option></select></label>
    <span id="herdr-summary" class="herdr-summary" role="status" aria-live="polite">Loading live states...</span>
  </div>
  <div class="herdr-columns" aria-hidden="true"><span>Workspace</span><span>Machine / pane</span><span>Agent</span><span>Session</span><span>State</span></div>
  <ul id="herdr-rows" class="herdr-rows" aria-label="Live agents"><li class="herdr-empty">Connecting to agent collectors...</li></ul>
  <p id="herdr-note" class="herdr-note">The dashboard reads agent states. Use a machine terminal to interact.</p>
  </div>
</section>
<section class="usage-section">
  <button id="usage-toggle" aria-controls="usage-body" class="usage-toggle" aria-expanded="true">
    <span class="chev">▾</span> Usage &amp; Balances
    <span class="hint">plan speedometers · balances · agent polls every 60s</span>
  </button>
  <div id="usage-body" class="usage-body"><p class="empty">loading usage…</p></div>
</section>
<section class="pulse-section">
  <button id="pulse-toggle" class="usage-toggle" aria-expanded="true" aria-controls="pulse-body">
    <span class="chev">▾</span> Pulse
    <span class="hint">rest = active total · beat = +1 activity</span>
  </button>
  <div id="pulse-body" class="usage-body" aria-labelledby="pulse-toggle">
    <div class="pulse-panel">
      <div class="pulse-readout" aria-live="polite" aria-atomic="true">
        <span id="pulse-count" class="pulse-count">0</span>
        <span id="pulse-label" class="pulse-label">active sessions</span>
      </div>
      <div class="pulse-screen">
        <canvas id="pulse-canvas" class="pulse-canvas" width="960" height="182" role="img" aria-label="0 active agent sessions"></canvas>
        <span id="pulse-cursor" class="pulse-cursor" aria-hidden="true"></span>
      </div>
    </div>
  </div>
</section>
<main id="app"><p class="empty">loading fleet…</p></main>
<footer>hs-pi-dashboard · <a href="/api/fleet">/api/fleet</a></footer>

<script src="/assets/herdr.js"></script>
<script src="/assets/smoothie-1.36.1.js"></script>
<script>
const esc = (s) => (s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function rel(ts) {
  if (!ts) return "—";
  const d = (Date.now() - new Date(ts).getTime()) / 1000;
  if (d < 5) return "now";
  if (d < 90) return Math.round(d) + "s ago";
  if (d < 5400) return Math.round(d / 60) + "m ago";
  if (d < 172800) return Math.round(d / 3600) + "h ago";
  return Math.round(d / 86400) + "d ago";
}

// Compact no-seconds duration, statusline style: "42m" / "5h 4m" / "6d 18h".
function compactDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h " + (m % 60) + "m";
  const d = Math.floor(h / 24);
  return d + "d " + (h % 24) + "h";
}

// Live reset countdown: recomputed every render so cached agent data never
// shows a stale "resets now".
function resetCountdown(resetAt) {
  if (!resetAt) return "reset time unavailable";
  const ms = new Date(resetAt).getTime() - Date.now();
  if (!Number.isFinite(ms)) return "reset time unavailable";
  if (ms <= 0) return "resetting…";
  return "resets in " + compactDur(ms);
}

// Session span. Active sessions are still growing, so measure to now (this
// recomputes on every 5s render); ended/idle ones measure to their last
// write — Hermes folds endedAt into lastActivity upstream.
function durationOf(s) {
  if (!s.startedAt) return "";
  const start = new Date(s.startedAt).getTime();
  const end = s.active ? Date.now() : new Date(s.lastActivity || s.startedAt).getTime();
  const ms = end - start;
  if (!Number.isFinite(ms) || ms < 0) return "";
  return compactDur(ms);
}

// --- usage speedometers -----------------------------------------------------
// HTML/SVG adaptation of GPUI Kit chart styling; no native GPUI runtime.
function usedPercent(value) {
  return Number.isFinite(value) ? Math.max(0, Math.min(100, value)) : null;
}
function projectedPercent(value) {
  return Number.isFinite(value) && value >= 0 ? value : null;
}
function usageColor(pct) {
  return pct == null ? "#aaa398" : pct >= 85 ? "#f08b8b" : pct >= 65 ? "#e5b567" : "#73c6a3";
}
function polar(cx, cy, r, deg) {
  const a = ((deg - 180) * Math.PI) / 180;
  return [cx - r * Math.cos(a), cy - r * Math.sin(a)];
}
function arcPath(cx, cy, r, startDeg, endDeg) {
  const [sx, sy] = polar(cx, cy, r, startDeg);
  const [ex, ey] = polar(cx, cy, r, endDeg);
  return `M ${sx.toFixed(2)} ${sy.toFixed(2)} A ${r} ${r} 0 0 1 ${ex.toFixed(2)} ${ey.toFixed(2)}`;
}
function forecastText(projected) {
  return projected == null ? "forecast unavailable" : `At reset ${Math.round(projected)}%${projected > 100 ? " · over limit" : ""}`;
}
function gaugeSvg(g) {
  const used = usedPercent(g.usedPercent);
  const projected = projectedPercent(g.projectedEnd);
  const value = used == null ? "unavailable" : `${Math.round(used)}%`;
  const reset = resetCountdown(g.resetAt);
  const forecast = forecastText(projected);
  const cx = 72, cy = 70, r = 58;
  const measured = used > 0
    ? `<path class="measured-arc" d="${arcPath(cx, cy, r, 180, 180 + used * 1.8)}" stroke="${usageColor(used)}" stroke-width="6" stroke-linecap="round" fill="none"/>` : "";
  let marker = "";
  if (projected != null) {
    const [x, y] = polar(cx, cy, r, 180 + Math.min(100, projected) * 1.8);
    marker = `<circle class="forecast-marker" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="4" fill="var(--card)" stroke="${projected > 100 ? "#f08b8b" : "#aaa398"}" stroke-width="1.5"/>`;
  }
  return `<div class="gauge" role="img" aria-label="${esc(g.label)}: ${value}${used == null ? "" : " used"}; ${esc(reset)}; ${esc(forecast)}">
    <span class="glabel">${esc(g.label)}</span>
    <div class="gauge-dial">
      <svg viewBox="0 0 144 88" aria-hidden="true" focusable="false">
        <path d="${arcPath(cx, cy, r, 180, 360)}" stroke="#333333" stroke-width="6" stroke-linecap="round" fill="none"/>
        ${measured}${marker}
      </svg>
      <span class="gvalue ${used == null ? "unavailable" : ""}">${value}${used == null ? "" : "<small>used</small>"}</span>
    </div>
    <span class="greset">${esc(reset)}</span>
    <span class="gproj ${projected > 100 ? "over" : ""}">${projected == null ? "" : '<span class="forecast-key" aria-hidden="true"></span>'}${esc(forecast)}</span>
  </div>`;
}
function usageFreshness(card) {
  const fetched = Date.parse(card.fetchedAt || "");
  if (!Number.isFinite(fetched)) return "update time unavailable";
  const age = Math.max(0, Date.now() - fetched);
  return `${age > 180000 ? "stale · " : ""}${compactDur(age)} ago`;
}
function usageCard(card, machine) {
  const collapsible = card.kind !== "unknown";
  const collapsed = collapsible && cardCollapsed(machine, card.key);
  const label = `<span class="ucard-label">${esc(card.label)}</span><span class="usage-stale">${esc(usageFreshness(card))}</span>`;
  const id = "usage-card-" + encodeURIComponent(machine + ":" + card.key);
  const heading = collapsible
    ? `<button type="button" class="ucard-toggle" data-machine="${esc(machine)}" data-key="${esc(card.key)}" aria-expanded="${!collapsed}" aria-controls="${esc(id)}">${label}<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>`
    : label;
  const notice = card.error ? `<span class="ucard-error ucard-notice">${esc(card.error)}${card.gauges?.length || card.balanceUsd != null ? " · cached values" : ""}</span>` : "";
  let body;
  if (collapsed) body = compactBody(card);
  else if (card.kind === "quota") body = card.gauges?.length
    ? `<div class="gauges">${card.gauges.map(gaugeSvg).join("")}</div>`
    : '<span class="ucard-error">usage unavailable</span>';
  else if (card.kind === "balance") body = Number.isFinite(card.balanceUsd)
    ? `<div class="balance"><span class="amount">$${card.balanceUsd.toFixed(2)}</span></div>`
    : '<span class="ucard-error">balance unavailable</span>';
  else body = '<span class="ucard-error">no usage source yet</span>';
  return `<div class="ucard ${collapsed ? "collapsed" : ""}"><div class="ucard-head">${heading}</div><div id="${esc(id)}">${notice}${body}</div></div>`;
}
function compactBody(card) {
  if (card.kind === "quota") {
    const minis = (card.gauges || []).map((g) => {
      const used = usedPercent(g.usedPercent);
      const projected = projectedPercent(g.projectedEnd);
      return `<span class="mini">${esc(g.label)} <b style="color:${usageColor(used)}">${used == null ? "unavailable" : Math.round(used) + "% used"}</b><span class="gproj ${projected > 100 ? "over" : ""}">${esc(forecastText(projected))}</span></span>`;
    }).join("");
    return `<div class="ucard-compact">${minis || '<span class="ucard-error">usage unavailable</span>'}</div>`;
  }
  return Number.isFinite(card.balanceUsd)
    ? `<div class="ucard-compact"><span class="mini"><b style="color:var(--gold)">$${card.balanceUsd.toFixed(2)}</b></span></div>`
    : '<span class="ucard-error">balance unavailable</span>';
}

let lastFleet = null;

// --- fleet pulse -----------------------------------------------------------
// The trace samples the active-session count continuously so time visibly
// moves beneath the live cursor. A meaningful update to an active row drives
// one short monitor pulse above that resting level.
const PULSE_TOGGLE_KEY = "hs-pi-dashboard:pulse-open";
const PULSE_CURSOR_RATIO = .75;
const PULSE_MILLIS_PER_PIXEL = 20;
const PULSE_SAMPLE_MS = 33;
const PULSE_HISTORY_MS = 2 * 60 * 1000;
const PULSE_SHAPE = [
  [0, 0], [35, .1], [58, 0], [92, 0], [125, 1],
  [170, 1], [210, .08], [275, .22], [410, 0],
];
const PULSE_DURATION_MS = PULSE_SHAPE[PULSE_SHAPE.length - 1][0];
const PULSE_BEAT_AMPLITUDE = 1;
const PULSE_BASE_GRID_CEILING = 5;
const PULSE_EDGE_PADDING_RATIO = .035;
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
let pulseChart = null;
let pulseSeries = null;
let pulseSampleTimer = null;
let pulseCursorFrame = null;
let pulseStartedAt = null;
let pulseBaseline = 0;
let pulseScaleFloor = 1;
let pulseDisplayRange = { min: -.025, max: 1.12 };
let pulseCursorBeatTimer = null;

function pulseOpen() {
  return document.getElementById("pulse-toggle").getAttribute("aria-expanded") === "true";
}

function pulseGridLines(ceiling) {
  return Array.from({ length: ceiling + 1 }, (_, value) => ({
    value,
    color: "rgba(50,255,126,.11)",
    lineWidth: 1,
  }));
}

function pulseVisibleMax() {
  return (pulseSeries?.data || []).reduce((max, point) => Math.max(max, point[1]), 0);
}

function pulseYRange() {
  const ceiling = Math.max(
    PULSE_BASE_GRID_CEILING,
    Math.ceil(pulseVisibleMax()) + 1,
    Math.ceil(pulseScaleFloor),
  );
  const padding = ceiling * PULSE_EDGE_PADDING_RATIO;
  pulseDisplayRange = { min: -padding, max: ceiling + padding };
  if (pulseChart) pulseChart.options.horizontalLines = pulseGridLines(ceiling);
  return pulseDisplayRange;
}

function syncPulseDelay() {
  if (!pulseChart) return;
  const canvas = document.getElementById("pulse-canvas");
  const width = canvas.clientWidth || canvas.width;
  pulseChart.delay = -Math.round(width * PULSE_MILLIS_PER_PIXEL * (1 - PULSE_CURSOR_RATIO));
}

function updatePulseCursor(value) {
  const cursor = document.getElementById("pulse-cursor");
  const screen = cursor.parentElement;
  const renderedMin = pulseChart && Number.isFinite(pulseChart.currentVisMinValue)
    ? pulseChart.currentVisMinValue
    : pulseDisplayRange.min;
  const renderedRange = pulseChart && Number.isFinite(pulseChart.currentValueRange) && pulseChart.currentValueRange > 0
    ? pulseChart.currentValueRange
    : pulseDisplayRange.max - pulseDisplayRange.min;
  const ratio = renderedRange > 0 ? (value - renderedMin) / renderedRange : 0;
  const bottom = Math.max(6, Math.min(screen.clientHeight - 6, ratio * screen.clientHeight));
  cursor.style.bottom = `${bottom}px`;
}

function pulseSeriesValueAt(timestamp) {
  const data = pulseSeries?.data || [];
  if (!data.length) return pulseBaseline;
  if (timestamp <= data[0][0]) return data[0][1];
  for (let i = data.length - 1; i >= 0; i--) {
    const [leftTime, leftValue] = data[i];
    if (leftTime > timestamp) continue;
    if (i === data.length - 1) return leftValue;
    const [rightTime, rightValue] = data[i + 1];
    const progress = (timestamp - leftTime) / (rightTime - leftTime);
    return leftValue + (rightValue - leftValue) * progress;
  }
  return data[0][1];
}

function renderedPulseCursorValue() {
  if (!pulseChart || !Number.isFinite(pulseChart.lastChartTimestamp)) {
    return pulseValueAt(Date.now());
  }
  const canvas = document.getElementById("pulse-canvas");
  const width = canvas.clientWidth || canvas.width;
  const cursorTime = pulseChart.lastChartTimestamp
    - width * PULSE_MILLIS_PER_PIXEL * (1 - PULSE_CURSOR_RATIO);
  return pulseSeriesValueAt(cursorTime);
}

function startPulseCursorTracking() {
  if (pulseCursorFrame !== null) return;
  const track = () => {
    updatePulseCursor(renderedPulseCursorValue());
    pulseCursorFrame = requestAnimationFrame(track);
  };
  pulseCursorFrame = requestAnimationFrame(track);
}

function stopPulseCursorTracking() {
  if (pulseCursorFrame === null) return;
  cancelAnimationFrame(pulseCursorFrame);
  pulseCursorFrame = null;
}

function pulseValueAt(now) {
  if (pulseStartedAt === null) return pulseBaseline;
  const elapsed = now - pulseStartedAt;
  if (elapsed < 0 || elapsed >= PULSE_DURATION_MS) {
    pulseStartedAt = null;
    return pulseBaseline;
  }
  for (let i = 1; i < PULSE_SHAPE.length; i++) {
    const [rightTime, rightValue] = PULSE_SHAPE[i];
    if (elapsed <= rightTime) {
      const [leftTime, leftValue] = PULSE_SHAPE[i - 1];
      const progress = (elapsed - leftTime) / (rightTime - leftTime);
      const beat = leftValue + (rightValue - leftValue) * progress;
      return pulseBaseline + PULSE_BEAT_AMPLITUDE * beat;
    }
  }
  return pulseBaseline;
}

function samplePulse(now = Date.now()) {
  if (!pulseSeries) return;
  const value = pulseValueAt(now);
  pulseSeries.append(now, value);
  pulseSeries.dropOldData(now - PULSE_HISTORY_MS, 2);
}

function startPulseSampling() {
  if (pulseSampleTimer !== null) return;
  samplePulse();
  pulseSampleTimer = setInterval(samplePulse, PULSE_SAMPLE_MS);
}

function stopPulseSampling() {
  if (pulseSampleTimer === null) return;
  clearInterval(pulseSampleTimer);
  pulseSampleTimer = null;
}

function renderStaticPulse(renderAt = Date.now()) {
  if (!pulseChart || !pulseOpen() || document.hidden) return;
  pulseChart.resize();
  syncPulseDelay();
  pulseChart.render(document.getElementById("pulse-canvas"), renderAt);
  updatePulseCursor(renderedPulseCursorValue());
}

function syncPulseMotion() {
  if (!pulseChart) return;
  const visible = pulseOpen() && !document.hidden;
  const animate = visible && !reducedMotion.matches;
  if (animate) {
    pulseChart.start();
    startPulseSampling();
    startPulseCursorTracking();
  } else {
    stopPulseSampling();
    stopPulseCursorTracking();
    pulseChart.stop();
    if (visible) samplePulse();
    renderStaticPulse();
  }
}

function triggerActivityPulse(count) {
  if (!pulseSeries || !pulseOpen() || document.hidden || count <= 0) return;
  const now = Date.now();
  pulseBaseline = count;
  pulseScaleFloor = count + PULSE_BEAT_AMPLITUDE + 1;
  pulseYRange(count + PULSE_BEAT_AMPLITUDE);
  const cursor = document.getElementById("pulse-cursor");

  if (reducedMotion.matches) {
    for (const [offset, value] of PULSE_SHAPE) {
      pulseSeries.append(now - PULSE_DURATION_MS + offset, pulseBaseline + PULSE_BEAT_AMPLITUDE * value);
    }
    pulseSeries.append(now, pulseBaseline);
    pulseSeries.dropOldData(now - PULSE_HISTORY_MS, 2);
    renderStaticPulse(now);
    return;
  }

  pulseStartedAt = now;
  cursor.classList.remove("beat");
  void cursor.offsetWidth;
  cursor.classList.add("beat");
  clearTimeout(pulseCursorBeatTimer);
  pulseCursorBeatTimer = setTimeout(() => cursor.classList.remove("beat"), 520);
}

function initPulse() {
  const canvas = document.getElementById("pulse-canvas");
  const toggle = document.getElementById("pulse-toggle");
  const body = document.getElementById("pulse-body");
  pulseSeries = new TimeSeries();
  const initialSampleAt = Date.now();
  pulseSeries.append(initialSampleAt - PULSE_HISTORY_MS, 0);
  pulseSeries.append(initialSampleAt, 0);
  pulseChart = new SmoothieChart({
    responsive: true,
    millisPerPixel: PULSE_MILLIS_PER_PIXEL,
    interpolation: "linear",
    scaleSmoothing: 1,
    yRangeFunction: ({ max }) => pulseYRange(max),
    grid: {
      fillStyle: "#000603",
      strokeStyle: "rgba(50,255,126,.11)",
      lineWidth: 1,
      millisPerLine: 5000,
      verticalSections: 0,
      borderVisible: false,
      sharpLines: true,
    },
    horizontalLines: pulseGridLines(PULSE_BASE_GRID_CEILING),
    labels: { disabled: true },
  });
  pulseChart.addTimeSeries(pulseSeries, {
    strokeStyle: "#32ff7e",
    lineWidth: 2.5,
    interpolation: "linear",
  });
  pulseChart.streamTo(canvas, 0);
  syncPulseDelay();
  updatePulseCursor(0);

  const apply = (open) => {
    toggle.setAttribute("aria-expanded", String(open));
    body.classList.toggle("collapsed", !open);
    if (open) {
      pulseChart.resize();
      syncPulseDelay();
      updatePulseCursor(pulseValueAt(Date.now()));
    }
    syncPulseMotion();
  };
  const saved = localStorage.getItem(PULSE_TOGGLE_KEY);
  apply(saved === null ? true : saved === "true");
  toggle.addEventListener("click", () => {
    const open = !pulseOpen();
    apply(open);
    localStorage.setItem(PULSE_TOGGLE_KEY, String(open));
  });
  document.addEventListener("visibilitychange", syncPulseMotion);
  reducedMotion.addEventListener?.("change", syncPulseMotion);
  window.addEventListener("resize", () => {
    if (!pulseOpen()) return;
    pulseChart.resize();
    syncPulseDelay();
    updatePulseCursor(pulseValueAt(Date.now()));
    if (reducedMotion.matches) renderStaticPulse();
  });
}

function updatePulse(fleet) {
  const count = Number.isFinite(fleet.activeSessions) ? fleet.activeSessions : 0;
  pulseBaseline = count;
  pulseScaleFloor = count + PULSE_BEAT_AMPLITUDE;
  pulseYRange(count);
  const now = Date.now();
  if (reducedMotion.matches && pulseOpen() && !document.hidden) {
    samplePulse(now);
    // renderSessions runs next and may append a synchronized static beat.
    // Paint on the next frame so that beat is not throttled behind this baseline.
    requestAnimationFrame(() => renderStaticPulse());
  } else {
    updatePulseCursor(pulseValueAt(now));
  }
  const countEl = document.getElementById("pulse-count");
  const labelEl = document.getElementById("pulse-label");
  const canvas = document.getElementById("pulse-canvas");
  countEl.textContent = String(count);
  labelEl.textContent = count === 1 ? "active session" : "active sessions";
  canvas.setAttribute("aria-label", `${count} active agent ${count === 1 ? "session" : "sessions"}`);
}

function snapshotActiveSessionCount(fleet) {
  const piSessions = (fleet.machines || []).reduce((count, machine) => {
    if (!machine.online) return count;
    return count + (machine.sessions || []).filter(session => session.active).length;
  }, 0);
  const hermesSessions = (fleet.hermesSessions || []).filter(session => session.active).length;
  return piSessions + hermesSessions;
}

function cardCollapsed(machine, key) {
  return localStorage.getItem("hs-pi-dashboard:card-collapsed:" + machine + ":" + key) === "1";
}

function toggleCard(machine, key) {
  const storageKey = "hs-pi-dashboard:card-collapsed:" + machine + ":" + key;
  localStorage.setItem(storageKey, cardCollapsed(machine, key) ? "0" : "1");
  if (lastFleet) renderUsage(lastFleet);
}

function bindUsageCardToggles() {
  document.getElementById("usage-body").addEventListener("click", (e) => {
    const el = e.target.closest(".ucard-toggle");
    if (el) toggleCard(el.dataset.machine, el.dataset.key);
  });
}

function renderUsage(fleet) {
  const body = document.getElementById("usage-body");
  const focused = document.activeElement;
  const focusKey = body.contains(focused) && focused?.matches(".ucard-toggle") ? { ...focused.dataset } : null;
  const restoreFocus = () => {
    if (!focusKey) return;
    const control = [...body.querySelectorAll(".ucard-toggle")].find((el) => el.dataset.machine === focusKey.machine && el.dataset.key === focusKey.key);
    (control || document.getElementById("usage-toggle")).focus({ preventScroll: true });
  };
  const machines = (fleet.machines ?? []).filter((m) => m.usage && m.usage.cards?.length);
  if (!machines.length) {
    body.innerHTML = '<p class="empty">no usage reporters online yet</p>';
    restoreFocus();
    return;
  }
  // Usage cards are account-level, not per machine: several agents report the
  // same subscriptions, so merge them by key and keep the healthiest, freshest
  // card for each. One global set: speedometers on top, balances underneath.
  const byKey = new Map();
  for (const m of machines) {
    for (const c of m.usage.cards) {
      const prev = byKey.get(c.key);
      const better = !prev
        || (prev.error && !c.error)
        || ((!!prev.error === !!c.error)
            && (Date.parse(c.fetchedAt) || 0) > (Date.parse(prev.fetchedAt) || 0));
      if (better) byKey.set(c.key, c);
    }
  }
  const cards = [...byKey.values()];
  // Masonry columns: column 1 stacks the compact cards — single-gauge
  // speedometers with the balances tucked directly underneath; every other
  // speedometer card gets its own column (extras round-robin over columns
  // 2-3). All cards render content-sized, so the section stays tight.
  const isSolo = (c) => c.kind === "quota" && c.gauges?.length === 1;
  const col1 = [
    ...cards.filter((c) => isSolo(c)),
    ...cards.filter((c) => c.kind !== "quota"),
  ];
  const multis = cards.filter((c) => c.kind === "quota" && !isSolo(c));
  const cols = [col1];
  multis.forEach((c, i) => (cols[1 + (i % 2)] ??= []).push(c));
  body.innerHTML =
    `<div class="usage-grid">${cols.filter((col) => col.length).map((col) =>
      `<div class="usage-col">${col.map((c) => usageCard(c, "global")).join("")}</div>`).join("")}</div>`;
  restoreFocus();
}

const USAGE_TOGGLE_KEY = "hs-pi-dashboard:usage-open";
function initUsageToggle() {
  const toggle = document.getElementById("usage-toggle");
  const body = document.getElementById("usage-body");
  const apply = (open) => {
    toggle.setAttribute("aria-expanded", String(open));
    body.classList.toggle("collapsed", !open);
  };
  const saved = localStorage.getItem(USAGE_TOGGLE_KEY);
  apply(saved === null ? true : saved === "true");
  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") !== "true";
    apply(open);
    localStorage.setItem(USAGE_TOGGLE_KEY, String(open));
  });
}

// Row signature tracks meaningful session state. A signature change means
// the 5s poll just delivered something new; those rows flash on render.
const sessionSig = (s) => {
  const project = s.project || s.cwd?.split(/[\\/]/).filter(Boolean).pop() || s.id?.slice(0, 8) || "session";
  return [s.id, project, s.provider || "", s.model || "", s.thinkingLevel || "",
    s.messageCount || 0, s.toolCallCount || 0, s.inputTokens || 0, s.outputTokens || 0,
    +(s.costUsd || 0).toFixed(4), !!s.active, s.lastActivity || "",
    s.name || "", s.status || "", s.activitySource || "", s.turnStartedAt || "", s.turnCompletedAt || "", JSON.stringify(s.t3Usage || null),
    (s.outputs || []).map((o) => o.at).join(",")].join("|");
};
let lastSigs = {};
let sessionBaselineReady = false;
let activeFlashDetected = false;
const flashingSessions = new Map();
const ROW_FLASH_MS = 1200;
// Sessions whose details are expanded (default: collapsed). Keys match
// the row keys below, so the choice survives the 5s re-render.
const expandedOutputs = new Set();
let sourceDiagnosticsOpen = false;
// Table paging: 20 sessions per page; state survives the 5s re-render.
const PAGE_SIZE = 20;
let currentPage = 1;

// Stored output remains available however old it is. T3 rows also have
// reported statistics, so they can expand even without assistant output.
function availableOutputs(s) {
  const outs = s.outputs || [];
  return outs.length ? outs : null;
}

// Pure renderer for one session's output rows (newest first).
function renderOutputRows(outs, flash, detailsId = "") {
  return outs.map((o, i) => {
    const age = Date.now() - new Date(o.at).getTime();
    if (!Number.isFinite(age) || age < 0) return "";
    const cls = "subrow" + (i === 0 && flash ? " flash" : "");
    return `
  <tr class="${cls}"${i === 0 && detailsId ? ` id="${esc(detailsId)}"` : ""}><td colspan="9"><div>
    <span class="out-text" title="${esc(o.text)}">${esc(o.text)}</span>
    <span class="out-age" title="${esc(o.at)}">${compactDur(age)}</span>
  </div></td></tr>`;
  }).join("");
}

function sessionsTable(machines, hermesSessions) {
  const newSigs = {};
  const flat = [];
  (machines ?? []).forEach((m) => {
    (m.sessions ?? []).forEach((s) => {
      newSigs[m.name + "/" + (s.id || "")] = sessionSig(s);
      flat.push({ s, m, kind: "pi" });
    });
  });
  (hermesSessions ?? []).forEach((s) => {
    const profileAlias = { default: "COS", janitor: "Janitor", developer: "Developer" }[s.profile] || s.profile;
    const entry = {
      id: s.id,
      source: "hermes",
      cwd: s.cwd || "~/.hermes",
      project: (s.name || s.source + ":" + (s.id || "").slice(0, 8)) + (profileAlias ? " [" + profileAlias + "]" : ""),
      provider: "hermes:" + (s.profile || "unknown"),
      model: s.model || "",
      thinkingLevel: "",
      messageCount: s.messageCount || 0,
      toolCallCount: s.toolCallCount || 0,
      inputTokens: s.inputTokens || 0,
      outputTokens: s.outputTokens || 0,
      costUsd: s.estimatedCostUsd || 0,
      startedAt: s.startedAt,
      lastActivity: s.endedAt || s.lastActivity || s.startedAt,
      active: s.active === true,
      outputs: s.outputs || [],
    };
    newSigs["hermes/" + (s.id || "")] = sessionSig(entry);
    const machineLabel = "mini (" + (profileAlias || "hermes") + ")";
    flat.push({ s: entry, m: { name: machineLabel, online: true }, kind: "hermes" });
  });
  const entryIsLive = (entry) =>
    entry.kind === "hermes" ? entry.s.active : (entry.s.active && entry.m.online);
  // Recency first: active sessions bubble ahead of idle.
  flat.sort((a, b) => {
    const aActive = entryIsLive(a);
    const bActive = entryIsLive(b);
    if (aActive !== bActive) return bActive - aActive;
    return new Date(b.s.lastActivity || 0) - new Date(a.s.lastActivity || 0);
  });
  // Quiet runs (no stored output) add no value here — drop them before
  // paging. The flash signature map above still covers every session, so a
  // quiet run that later speaks flashes when it first appears.
  const renderAt = Date.now();
  const entryKey = (entry) =>
    (entry.kind === "hermes" ? "hermes/" : entry.m.name + "/") + (entry.s.id || "");
  // Detect activity across the complete session set before pagination. An
  // active run can update while the operator is looking at another page.
  for (const entry of flat) {
    const key = entryKey(entry);
    const changed = sessionBaselineReady && lastSigs[key] !== newSigs[key];
    if (changed) flashingSessions.set(key, renderAt + ROW_FLASH_MS);
    if (changed && entryIsLive(entry)) activeFlashDetected = true;
  }
  // Active work belongs in the table before it has produced assistant text.
  // Completed quiet Pi runs stay hidden; T3 statistics remain expandable.
  const visible = flat.filter((entry) =>
    entry.s.source === "t3" || entryIsLive(entry) || (entry.s.outputs || []).length > 0);
  const totalPages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const pageItems = visible.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
  const rows = pageItems.map((entry) => {
    const key = entryKey(entry);
    const flash = (flashingSessions.get(key) || 0) > renderAt;
    const outs = availableOutputs(entry.s);
    const isT3 = entry.s.source === "t3";
    const expandable = isT3 || !!outs;
    const expandedNow = expandable && expandedOutputs.has(key);
    const detailsId = "session-details-" + encodeURIComponent(key);
    const metrics = expandedNow && isT3 ? t3Metrics(entry.s, entry.m, flash, detailsId) : "";
    const outputs = expandedNow && outs ? renderOutputRows(outs, flash, isT3 ? "" : detailsId) : "";
    return sessionRow(entry.s, entry.m, flash, entry.kind, expandable, expandedNow, key, detailsId) + metrics + outputs;
  });
  lastSigs = newSigs;
  for (const [key, expiresAt] of flashingSessions) {
    if (expiresAt <= Date.now() || !newSigs[key]) flashingSessions.delete(key);
  }
  // Hermes rows arrive via the Hermes feed regardless of machine state, so
  // the empty states below distinguish "nothing configured" from
  // "configured, but nothing has spoken yet".
  const body = flat.length === 0 ? `<tr class="empty-row"><td colspan="9">no machines configured</td></tr>`
    : visible.length === 0 ? `<tr class="empty-row"><td colspan="9">no active sessions or sessions with output yet</td></tr>`
    : rows.join("");
  const pager = totalPages > 1 ? `
  <div class="pager">
    <button class="pager-btn" data-page="prev" ${currentPage <= 1 ? "disabled" : ""}>‹</button>
    <span class="pager-info">page ${currentPage} / ${totalPages}</span>
    <button class="pager-btn" data-page="next" ${currentPage >= totalPages ? "disabled" : ""}>›</button>
    <span class="pager-count">${visible.length} sessions</span>
  </div>` : "";
  const sources = (machines || []).flatMap((m) => (m.sources || [])
    .filter((source) => source.source === "t3" && (!m.online || source.state !== "healthy"))
    .map((source) => ({ m, source, state: m.online ? source.state || "unavailable" : "offline" })));
  const counts = new Map();
  for (const { state } of sources) counts.set(state, (counts.get(state) || 0) + 1);
  const status = sources.length ? `<details class="source-status"${sourceDiagnosticsOpen ? " open" : ""}>
    <summary id="source-status-toggle">T3 collection · ${Array.from(counts, ([state, count]) => `<span${state !== "stale" ? ' class="source-failure"' : ""}>${count} ${esc(state)}</span>`).join(" · ")}</summary>
    <ul class="source-notices" aria-label="T3 collection diagnostics">${sources.map(({m, source, state}) => `<li>${esc(m.name)} · T3 ${esc(state)} · ${esc(m.online ? source.error || "Collection unavailable" : "Cached sessions; machine unreachable")} · ${esc(source.path || "environment unknown")}</li>`).join("")}</ul>
  </details>` : "";
  return `
  ${status}
  ${pager}
  <div class="session-table-wrap">
    <table class="session-table">
      <thead>
        <tr>
          <th>computer</th><th>session title</th><th>provider</th><th>model</th><th>effort</th><th>msgs</th><th>started</th><th>price</th><th>duration</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
  </div>`;
}

function applicationName(s) {
  switch (s.source) {
    case "pi": return "Pi";
    case "t3": return "T3 Code";
    case "claude-code": return "Claude Code";
    case "hermes": return "Hermes";
    default: return "Unknown app";
  }
}

function sessionRow(s, m, flash, kind, avail, expandedNow, key, detailsId) {
  const live = kind === "pi" ? (s.active && m.online) : s.active;
  const isT3 = s.source === "t3";
  const session = (isT3 && s.name) || s.project || s.cwd?.split(/[\\/]/).filter(Boolean).pop() || s.id?.slice(0, 8) || "session";
  const provider = s.provider || "";
  const model = s.model || "";
  const effort = s.thinkingLevel || "";
  const msgs = s.messageCount ? String(s.messageCount) : "";
  // Started shown as a compact age (same format as duration); the exact
  // timestamp stays in the cell tooltip.
  const started = s.startedAt ? compactDur(Date.now() - new Date(s.startedAt).getTime()) : "";
  const dur = isT3 ? t3TurnDuration(s, m.online) : durationOf({ ...s, active: live });
  const price = isT3 ? "n/a" : s.costUsd >= 0.00005 ? `$${s.costUsd.toFixed(s.costUsd < 0.01 ? 4 : 2)}` : "";
  // T3 statistics and stored output can be expanded independently of activity.
  const cls = (live ? "active" : (isT3 && m.online ? "idle" : "offline")) + (flash ? " flash" : "")
    + (expandedNow ? " has-sub" : "") + (avail ? " toggleable" : "");
  const attrs = avail ? ` class="${cls}" data-skey="${esc(key)}"` : ` class="${cls}"`;
  const title = avail ? `<button class="session-toggle" id="session-toggle-${esc(encodeURIComponent(key))}" aria-expanded="${expandedNow}"${expandedNow ? ` aria-controls="${esc(detailsId)}"` : ""}><span class="out-chev" aria-hidden="true">${expandedNow ? "▾" : "▸"}</span>${esc(session)}</button>` : esc(session);
  return `
  <tr${attrs}>
    <td>${esc(m.name)}</td>
    <td class="title${isT3 ? " t3-title" : ""}" title="${esc(kind === "hermes" ? (s.source + ":" + s.id) : (s.cwd || ""))}">${title}<span class="session-meta"><span class="session-app">${applicationName(s)}</span>${isT3 ? ` · <span class="session-state ${esc(m.online ? s.status : "unavailable")}">${esc(m.online ? s.status : "offline")}</span>${s.activitySource === "claude-code" && live ? " · Claude transcript active" : ""} · ${esc(s.project || "repository unknown")}` : ""}</span></td>
    <td>${esc(provider)}</td>
    <td>${esc(model)}</td>
    <td>${esc(effort)}</td>
    <td>${msgs}</td>
    <td title="${esc(s.startedAt || "")}">${esc(started)}</td>
    <td>${price}</td>
    <td>${esc(dur)}</td>
  </tr>`;
}

function t3TurnDuration(s, online) {
  if (!s.turnStartedAt) return "n/a";
  const start = new Date(s.turnStartedAt).getTime();
  const end = s.turnCompletedAt ? new Date(s.turnCompletedAt).getTime()
    : (online && s.active ? Date.now() : new Date(s.lastActivity).getTime());
  const ms = end - start;
  if (!Number.isFinite(ms) || ms < 0) return "n/a";
  return ms < 60000 ? Math.floor(ms / 1000) + "s" : compactDur(ms);
}

function t3Metrics(s, m, flash, detailsId) {
  const u = s.t3Usage || {};
  const count = (n) => Number.isFinite(n) && n >= 0 ? n.toLocaleString("en-US") : "n/a";
  const cls = (m.online ? "" : " offline") + (flash ? " flash" : "");
  const metrics = [
    ...(s.activitySource === "claude-code" ? [["statistics", "cached T3"]] : []),
    ["tools", count(s.toolCallCount || 0)],
    ["in", count(u.inputTokens)], ["out", count(u.outputTokens)],
    ["total", count(u.totalTokens)], ["cache", count(u.cacheReadTokens)],
    ["reasoning", count(u.reasoningTokens)],
    ["context", count(u.contextTokens) + " / " + count(u.contextLimit)],
    ["turn", t3TurnDuration(s, m.online)],
  ];
  return `<tr class="t3-details${cls}" id="${esc(detailsId)}"><td colspan="9"><div class="t3-metrics" aria-label="T3 reported statistics">${metrics.map(([label, value]) => `<span><b>${label}</b> ${esc(value)}</span>`).join("")}</div></td></tr>`;
}

let lastHermes = [];

// Full re-render from cached data; toggling a session calls this directly so
// the click lands instantly instead of waiting for the next poll.
function renderSessions() {
  if (!lastFleet) return;
  activeFlashDetected = false;
  const app = document.getElementById("app");
  const focusedId = app.contains(document.activeElement) ? document.activeElement.id : "";
  const diagnostics = app.querySelector(".source-status");
  if (diagnostics) sourceDiagnosticsOpen = diagnostics.open;
  app.innerHTML = sessionsTable(lastFleet.machines, lastHermes);
  if (focusedId) document.getElementById(focusedId)?.focus({ preventScroll: true });
  renderUsage(lastFleet);
  HerdrDashboard.render(lastFleet);
  if (activeFlashDetected) triggerActivityPulse(lastFleet.activeSessions || 0);
}

const POLL_TIMEOUT_MS = 4500;
let tickInFlight = false;
async function tick() {
  if (tickInFlight) return;
  tickInFlight = true;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), POLL_TIMEOUT_MS);
  try {
    const fleetRes = await fetch("/api/fleet", { signal: controller.signal });
    const fleet = await fleetRes.json();
    document.getElementById("generated").innerHTML =
      `generated <b>${new Date(fleet.generatedAt).toLocaleTimeString('en-US', {timeZone: 'America/New_York'})} ET</b>`;
    lastFleet = {
      ...fleet,
      activeSessions: snapshotActiveSessionCount(fleet),
    };
    lastHermes = fleet.hermesSessions || [];
    updatePulse(lastFleet);
    renderSessions();
  } catch (err) {
    HerdrDashboard.fail();
    document.getElementById("app").innerHTML = `<p class="empty">fleet unreachable: ${esc(String(err))}</p>`;
  } finally {
    if (lastFleet) sessionBaselineReady = true;
    clearTimeout(timeout);
    controller.abort();
    tickInFlight = false;
  }
}

initUsageToggle();
bindUsageCardToggles();
initPulse();
tick();
setInterval(tick, 5000);
// Clicking an expandable session row toggles its details; its native button
// also supports Enter/Space. State
// lives in expandedOutputs so it survives the 5s re-render. Pager buttons
// share the same delegated listener.
document.getElementById("app").addEventListener("click", (e) => {
  const btn = e.target.closest(".pager-btn");
  if (btn && !btn.disabled) {
    if (btn.dataset.page === "prev") currentPage--;
    if (btn.dataset.page === "next") currentPage++;
    renderSessions();
    return;
  }
  const row = e.target.closest("tr[data-skey]");
  if (!row) return;
  const key = row.dataset.skey;
  if (expandedOutputs.has(key)) expandedOutputs.delete(key);
  else expandedOutputs.add(key);
  renderSessions();
});
</script>
</body>
