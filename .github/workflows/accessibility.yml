name: Accessibility

# Runs scripts/accessibility-check.cjs: axe-core against the synthetic fixture
# (states mismatch and failed-free) at 1280x900 and 390x844, plus a keyboard
# focus check. Fails on any axe violation, a keyboard failure or a scan error.
# Tool versions are pinned here and in the script; see the README.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  axe:
    name: Dashboard accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test the check
        run: node --test scripts/accessibility-check.test.cjs

      - name: Install pinned Playwright, axe-core and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/a11y" --no-save --no-audit --no-fund playwright@1.64.1 axe-core@4.13.0
          "$RUNNER_TEMP/a11y/node_modules/.bin/playwright" install --with-deps --only-shell chromium

      - name: Run accessibility check
        run: >-
          NODE_PATH="$RUNNER_TEMP/a11y/node_modules" node scripts/accessibility-check.cjs
          --json "$RUNNER_TEMP/a11y-report/report.json" --screenshot-dir "$RUNNER_TEMP/a11y-report"

      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-report
          path: ${{ runner.temp }}/a11y-report/
          if-no-files-found: ignore
