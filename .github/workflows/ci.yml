name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  platform:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Report toolchain
        run: go version

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Install gocyclo
        if: runner.os != 'macOS'
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        if: runner.os == 'macOS'
        run: go test ./...

      - name: Test with coverage
        if: runner.os == 'Windows'
        run: go test -covermode=atomic -coverprofile=cover.out ./...

      - name: Test with race detector and coverage
        if: runner.os == 'Linux'
        run: go test -race -p 1 -covermode=atomic -coverprofile=cover.out ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: Check reachable vulnerabilities
        run: govulncheck ./...

      # Repository-wide checks need only one runner, alongside the Linux tests.
      - name: Check Go formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Test dashboard renderers
        if: runner.os == 'Linux'
        run: node --test scripts/pulse.test.cjs scripts/sessions.test.cjs scripts/usage.test.cjs internal/web/herdr.test.cjs internal/web/projects.test.cjs internal/web/billing.test.cjs

      - name: Test deployment binary checks and systemd units
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s deploy -p "test_*.py"

      - name: Test coverage and CRAP gate
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Install deadcode
        if: runner.os == 'Linux'
        run: go install golang.org/x/tools/cmd/deadcode@v0.52.0

      - name: Deadcode
        if: runner.os == 'Linux'
        run: deadcode ./...

      # Last, so other findings still report. Fails on a coverage drop below the
      # declared floor or a CRAP regression; see scripts/crap-gate.json and the
      # README Build section.
      - name: Check coverage and CRAP
        if: runner.os != 'macOS'
        shell: bash
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/crap_gate.py
          --platform ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          --profile cover.out --report-dir crap-report --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage and CRAP report
        if: ${{ !cancelled() && runner.os != 'macOS' && hashFiles('crap-report/summary.md') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-crap-${{ runner.os }}
          path: crap-report/
          retention-days: 14

  # Keep the existing required status stable; it succeeds only when all legs do.
  verify:
    if: ${{ always() }}
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
