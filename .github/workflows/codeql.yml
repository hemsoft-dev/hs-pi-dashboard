name: CodeQL

# Static security analysis for the repository's own Go, JavaScript/TypeScript,
# Python and GitHub Actions code. Results appear on pull requests and on the
# repository's Security tab under Code scanning. The check is advisory: the
# main ruleset requires only `verify` (see README, "Security model (v1)").

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go is compiled; build it the same way ci.yml does so CodeQL sees
          # the exact toolchain from go.mod. `none` is not supported for Go.
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go
        if: matrix.build-mode == 'manual'
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
